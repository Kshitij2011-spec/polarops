# render.yaml — Render Blueprint for PolarOps
# https://docs.render.com/blueprint-spec

services:
  - type: web
    name: polarops-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: polarops-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false  # Set manually after Vercel deployment
      - key: PYTHON_VERSION
        value: "3.11.12"
      - key: DEBUG
        value: "false"

databases:
  - name: polarops-db
    plan: free
    region: oregon
    databaseName: polarops
